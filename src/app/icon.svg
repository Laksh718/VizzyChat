<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background circle -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </radialGradient>

    <!-- Sector gradients -->
    <linearGradient id="g0" x1="50" y1="6" x2="91.8" y2="36.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="g1" x1="91.8" y1="36.4" x2="75.9" y2="85.6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="g2" x1="75.9" y1="85.6" x2="24.1" y2="85.6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="g3" x1="24.1" y1="85.6" x2="8.2" y2="36.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="g4" x1="8.2" y1="36.4" x2="50" y2="6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB923C"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Center white highlight -->
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>

  <!-- Sector 0: top (violet→blue) -->
  <path d="M50 50 L50 6 A44 44 0 0 1 91.8 36.4 Z" fill="url(#g0)" opacity="0.95"/>
  <!-- Sector 1: upper-right (blue→cyan) -->
  <path d="M50 50 L91.8 36.4 A44 44 0 0 1 75.9 85.6 Z" fill="url(#g1)" opacity="0.95"/>
  <!-- Sector 2: lower-right (cyan→pink) -->
  <path d="M50 50 L75.9 85.6 A44 44 0 0 1 24.1 85.6 Z" fill="url(#g2)" opacity="0.95"/>
  <!-- Sector 3: lower-left (pink→orange) -->
  <path d="M50 50 L24.1 85.6 A44 44 0 0 1 8.2 36.4 Z" fill="url(#g3)" opacity="0.95"/>
  <!-- Sector 4: upper-left (orange→violet) -->
  <path d="M50 50 L8.2 36.4 A44 44 0 0 1 50 6 Z" fill="url(#g4)" opacity="0.95"/>

  <!-- Gap lines between sectors for the pinwheel look -->
  <line x1="50" y1="50" x2="50" y2="6"       stroke="#0a0814" stroke-width="2.5" opacity="0.7"/>
  <line x1="50" y1="50" x2="91.8" y2="36.4"   stroke="#0a0814" stroke-width="2.5" opacity="0.7"/>
  <line x1="50" y1="50" x2="75.9" y2="85.6"   stroke="#0a0814" stroke-width="2.5" opacity="0.7"/>
  <line x1="50" y1="50" x2="24.1" y2="85.6"   stroke="#0a0814" stroke-width="2.5" opacity="0.7"/>
  <line x1="50" y1="50" x2="8.2"  y2="36.4"   stroke="#0a0814" stroke-width="2.5" opacity="0.7"/>

  <!-- Center highlight circle -->
  <circle cx="50" cy="50" r="9" fill="url(#center)"/>
</svg>
